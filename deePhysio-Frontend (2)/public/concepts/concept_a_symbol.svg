<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cA_grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#2EA7B8" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="cA_grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA7B8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="cA_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- CONCEPT A: INTERLOCKING GEOMETRIC CP MONOGRAM -->
  <g transform="translate(0, 0)">
    <!-- THE OUTER "C" TRACK (Sleek bold geometry wrapping left) -->
    <path d="M 370 120
             C 270 50, 140 70, 90 160
             C 45 235, 45 305, 90 375
             C 145 460, 275 470, 365 410
             C 382 398, 386 376, 374 360
             C 362 344, 340 340, 324 350
             C 255 395, 160 385, 125 330
             C 95 285, 95 245, 125 200
             C 160 145, 255 135, 325 180
             C 340 190, 362 186, 374 170
             C 386 154, 382 132, 370 120 Z"
          fill="url(#cA_grad1)"
          filter="url(#cA_glow)"
    />

    <!-- THE "P" STEM AND VAULT (Solid confident presence) -->
    <path d="M 190 170
             C 190 150, 206 134, 226 134
             L 300 134
             C 365 134, 415 175, 415 240
             C 415 305, 365 346, 300 346
             L 250 346
             L 250 395
             C 250 415, 234 430, 214 430
             C 194 430, 190 415, 190 395
             Z"
          fill="url(#cA_grad2)"
    />

    <!-- THE PRECISION NEGATIVE-SPACE MEDICAL CROSS IN THE P LOOP -->
    <g transform="translate(305, 240)">
      <!-- Cutout background box matching current background for negative space effect -->
      <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#FFFFFF" />
      <!-- Medical cross in radiant teal -->
      <path d="M -10 -30 L 10 -30 C 13 -30, 15 -28, 15 -25 L 15 -10 L 30 -10 C 33 -10, 35 -8, 35 -5 L 35 5 C 35 8, 33 10, 30 10 L 15 10 L 15 25 C 15 28, 13 30, 10 30 L -10 30 C -13 30, -15 28, -15 25 L -15 10 L -30 10 C -33 10, -35 8, -35 5 L -35 -5 C -35 -8, -33 -10, -30 -10 L -15 -10 L -15 -25 C -15 -28, -13 -30, -10 -30 Z"
            fill="url(#cA_grad1)" />
      <!-- Central highlight -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- ACCENT NODES (Pilot guidance indicators) -->
    <circle cx="370" cy="120" r="16" fill="#06B6D4" />
    <circle cx="365" cy="410" r="16" fill="#10B981" />
  </g>
</svg>